<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Choose Option</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    body {
      background-color: #f5f7f5;
      min-height: 100vh;
    }

    .container {
      max-width: 100%;
      padding: 20px;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    header {
      background: linear-gradient(135deg, #00D061, #00D061);
      color: white;
      padding: 20px;
      text-align: center;
      border-radius: 0 0 20px 20px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      margin: -20px -20px 30px -20px;
    }

    .logo {
      font-size: 28px;
      font-weight: bold;
      letter-spacing: 0.5px;
    }

    .options-container {
      display: flex;
      flex-direction: column;
      gap: 20px;
      padding: 0 10px;
      flex-grow: 1;
      justify-content: center;
    }

    .option-button {
      background: white;
      border: none;
      padding: 20px;
      border-radius: 15px;
      text-align: left;
      display: flex;
      align-items: center;
      gap: 15px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
      transition: all 0.3s ease;
      cursor: pointer;
      position: relative;
      overflow: hidden;
    }

    .option-button:active {
      transform: scale(0.98);
    }

    .option-button::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: linear-gradient(135deg, rgba(46, 125, 50, 0.05), rgba(46, 125, 50, 0));
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .option-button:hover::after {
      opacity: 1;
    }

    .option-icon {
      background: #e8f5e9;
      padding: 12px;
      border-radius: 12px;
      color: #2e7d32;
      font-size: 24px;
    }

    .option-content {
      flex-grow: 1;
    }

    .option-title {
      font-size: 18px;
      font-weight: 600;
      color: #2e7d32;
      margin-bottom: 5px;
    }

    .option-description {
      font-size: 14px;
      color: #558b2f;
    }

    @media (min-width: 768px) {
      .container {
        max-width: 600px;
        margin: 0 auto;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="logo">BizAssist</div>
    </header>

    <div class="options-container">
      <button class="option-button" onclick="window.location.href='/videos-page'">
        <div class="option-icon">🎥</div>
        <div class="option-content">
          <div class="option-title">Continue to Video</div>
          <div class="option-description">Watch helpful business-related videos</div>
        </div>
      </button>

      <button class="option-button" onclick="window.location.href='/language'">
        <div class="option-icon">🤖</div>
        <div class="option-content">
          <div class="option-title">Continue to Chatbot</div>
          <div class="option-description">Get AI-powered business assistance</div>
        </div>
      </button>

      <!-- 🆕 New Caption Generator Button -->
      <button class="option-button" onclick="window.location.href='/caption-generator'">
        <div class="option-icon">✍️</div>
        <div class="option-content">
          <div class="option-title">Generate Social Captions</div>
          <div class="option-description">AI-generated captions based on your business</div>
        </div>
      </button>
      <button class="option-button" onclick="window.location.href='/15day-plan'">
        <div class="option-icon">📅</div>
        <div class="option-content">
          <div class="option-title">15-Day Social Media Plan</div>
          <div class="option-description">Day-wise content strategy for your business</div>
        </div>
      </button>
      <button class="option-button" onclick="window.location.href='/profile'">
        <div class="option-icon">👤</div>
        <div class="option-content">
          <div class="option-title">Your Profile</div>
        </div>
      </button>
      
    </div>
  </div>
</body>
</html>

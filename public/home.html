<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home Page</title>
    <style>
        @media only screen and (max-width: 600px) {
            body {
                font-family: Arial, sans-serif;
                margin: 0;
                padding: 0;
                background-color: #f4f4f4;
            }

            .container {
                width: 90%;
                max-width: 400px;
                background: white;
                padding: 20px;
                border-radius: 10px;
                box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
                margin: 0 auto;
                margin-top: 60px;
            }

            .header {
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                display: flex;
                justify-content: space-between;
                font-size: 24px;
                font-weight: bold;
                padding: 10px;
                background: white;
                border-bottom: 2px solid #ccc;
                box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
                align-items: center;
            }

            .header span {
                flex-grow: 1;
                text-align: center;
            }

            .user-info {
                display: flex;
                align-items: center;
                gap: 10px;
            }

            .header img {
                width: 30px;
                height: 30px;
                border-radius: 50%;
            }

            .card {
                background: #ffffff;
                padding: 15px;
                border-radius: 10px;
                box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
                margin-bottom: 15px;
                text-align: center;
            }

            .card img {
                width: 50px;
                height: 50px;
                border-radius: 50%;
            }

            .card-title {
                font-size: 18px;
                font-weight: bold;
                margin-top: 10px;
            }

            .card-details {
                font-size: 14px;
                color: #666;
            }

            .card-text {
                margin: 10px 0;
                font-size: 14px;
                color: #333;
            }

            .continue-button {
                display: block;
                width: 100%;
                padding: 10px;
                background-color: #ff6600;
                color: white;
                font-size: 16px;
                font-weight: bold;
                border: none;
                border-radius: 5px;
                cursor: pointer;
                margin-top: 10px;
            }

            .continue-button:hover {
                background-color: #e65c00;
            }
        }
    </style>
</head>

<body>
    <div class="header">
        <span id="username">Welcome, Guest</span>
        <div class="user-info">
            <img id="user-pic" src="default-avatar.png" alt="User Picture">
        </div>
    </div>

    <div class="container">
        <div class="card">
            <img src="datsun-logo.png" alt="chatbot logo">
            <div class="card-title">text</div>
            <div class="card-details">text</div>
            <hr>
            <div class="card-text">text</div>
            <button class="continue-button">text</button>
        </div>
        <div class="card">
            <img src="datsun-logo.png" alt="youtube logo">
            <div class="card-title">text</div>
            <div class="card-details">text</div>
            <hr>
            <div class="card-text">text</div>
            <button class="continue-button">text</button>
        </div>
    </div>

    <script>
        async function fetchUserInfo() {
            try {
                const response = await fetch('/user-info');
                if (!response.ok) throw new Error('Failed to fetch user info');

                const user = await response.json();
                document.getElementById('username').textContent = `Welcome, ${user.name}`;
                document.getElementById('user-pic').src = user.profilePicture || 'default-avatar.png';
            } catch (error) {
                console.error('Error fetching user info:', error);
            }
        }

        fetchUserInfo();
    </script>
</body>

</html>
